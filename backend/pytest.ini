[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
log_level = INFO
# A sourced ROS environment leaks its pytest plugins in via PYTHONPATH and they
# fail to import; disabling them is harmless where ROS is not installed.
addopts = -p no:launch_testing -p no:launch_ros
filterwarnings =
    # third-party deprecations (uvicorn's websockets backend, starlette test client)
    ignore::DeprecationWarning:websockets.*
    ignore::DeprecationWarning:uvicorn.*
    ignore::DeprecationWarning:starlette.*
